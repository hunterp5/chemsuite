# OpenMM environment for chemsuite's minimisation worker, Linux x86-64 (a cluster, or WSL on a
# Windows PC; NVIDIA GPU optional).
#
#   conda env create --solver libmamba -f envs/openmm-linux-64.yml
#
# Then set the env's bin/python as Preferences > External Tools > OpenMM Python (on Linux), or
# its Linux path as OpenMM Python (WSL) (on Windows), and press Test.
#
# - cuda-version must not exceed what the NVIDIA driver supports (nvidia-smi); see
#   envs/openmm-win-64.yml for why OpenMM 8.4.0 is pinned (provisional).
# - conda-forge's openmmforcefields brings AmberTools along on Linux; chemsuite does not use it.
name: chemsuite-openmm
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - openmm=8.4.0
  - cuda-version=12.6
  - pytorch-cpu
  - openmmforcefields=0.15.1
  - openff-toolkit-base=0.19.0
  - openff-interchange-base=0.5.5
  - openff-nagl=0.6.1
  - openff-nagl-models=2026.09.0
  - rdkit
  - numpy
  - lxml
