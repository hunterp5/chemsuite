[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chemsuite"
version = "0.1.0.dev0"
description = "Desktop medicinal chemistry workbench (PySide6 + RDKit)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Hunter Picard" }]
dependencies = [
    "PySide6-Essentials>=6.8",  # Essentials only: no QtWebEngine, no Qt3D, no QtMultimedia
    "pyqtgraph>=0.13.7",
    "rdkit>=2025.9.1",          # official PyPI name; never install rdkit-pypi alongside it
    "gemmi>=0.7",               # proteins: PDB/mmCIF, residues, alignment
    "meeko>=0.8",               # docking: the PDBQT files AutoDock Vina reads and writes
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.7",        # base install by decision (docs/PLAN.md §5); imported lazily
    "pacmap>=0.9",              # PaCMAP maps (Apache-2.0; pulls faiss-cpu, MIT); imported lazily
    "openpyxl>=3.1",            # Excel (.xlsx) read/write; base install by decision
    # CONFORGE, the default conformer generator (LGPL-2.1), wherever CDPKit ships a wheel:
    # Windows on Python 3.12 only, Linux x86-64, Apple silicon (macOS 26+: 1.3; older: 1.2.3).
    # Elsewhere pip would try its source build (Boost, CMake), so ETKDG is used instead.
    "cdpkit>=1.3; sys_platform == 'win32' and python_version == '3.12'",
    "cdpkit>=1.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cdpkit>=1.3; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '25'",
    "cdpkit==1.2.3; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release < '25'",
]

[project.gui-scripts]
chemsuite = "chemsuite.app.shell.main:main"

[project.optional-dependencies]
confab = ["openbabel>=3.2.0"]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chemsuite*"]

[tool.setuptools.package-data]
"chemsuite.ionisation" = ["data/*"]  # MolGpKa weights, site templates, licence
"chemsuite.ionisation.unipka" = ["data/*"]  # Uni-pKa site templates and licences
"chemsuite.sketch" = ["data/*"]  # Ketcher licence and notice; templates from P2
"chemsuite.protein.structure" = ["data/*"]  # residue templates from the wwPDB CCD (public domain)
"chemsuite.protein.prepare" = ["data/*"]  # ideal residue geometry from the wwPDB CCD (public domain)
"chemsuite.protein.dock" = ["bin/*", "bin/*/*"]  # the AutoDock Vina binaries, their licence and notice
"chemsuite.app.render3d" = ["shaders/*"]  # 3D Viewer shaders: sources and compiled .qsb
"chemsuite.protein.ui" = ["shaders/*"]  # Protein Viewer shaders

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "bench: performance benchmarks; run with `pytest -m bench`",
    "openmm: needs an OpenMM environment named by CHEMSUITE_OPENMM_PYTHON; `pytest -m openmm`",
]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["chemsuite", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplifications
    "BLE001",        # no blind `except Exception` (allowed only where it logs and re-raises,
    "S110",          #   or at a top-level handler with an explicit noqa and a reason)
    "RUF100",        # no stale noqa comments
    "C90",           # complexity: a branchy function is split, or exempted with a reason
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["chemsuite"]
