name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore: ["docs/**", "**/*.md"]  # documentation alone does not need the tests
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:  # run by hand (Actions tab or `gh workflow run CI --ref dev`)

concurrency:  # a newer push to the same branch replaces the run in progress
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - name: Ruff
        run: ruff check chemsuite tests scripts
      - name: Ruff format
        run: ruff format --check chemsuite tests scripts
      - name: GPL headers
        run: python scripts/check_gpl_headers.py

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -m "not bench"
      - name: 3D drawing (Linux, Mesa on a virtual display)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
          CHEMSUITE_REQUIRE_GPU: "1"
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python -m pytest tests/app/viewer/test_structure_viewer.py tests/protein/ui/test_protein_view.py -k "side_by_side or drawn" -rs
      - name: Benchmarks (200k rows)
        if: runner.os == 'Linux'
        run: python -m pytest -m bench
